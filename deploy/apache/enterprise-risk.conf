# /etc/apache2/sites-available/enterprise-risk.conf
# HTTP virtual host. "certbot --apache" will create the HTTPS copy
# (enterprise-risk-le-ssl.conf) and add an HTTP -> HTTPS redirect here.
# Replace YOUR-SUBDOMAIN with your Duck DNS subdomain.
<VirtualHost *:80>
    ServerName YOUR-SUBDOMAIN.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Only /api/ is forwarded to the backend (loopback only, port 8080 is never public).
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/enterprise-risk-error.log
    CustomLog ${APACHE_LOG_DIR}/enterprise-risk-access.log combined
</VirtualHost>
