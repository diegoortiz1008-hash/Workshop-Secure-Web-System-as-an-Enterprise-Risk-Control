spring.application.name=enterprise-risk-api

# --- OAuth 2.0 Resource Server (Auth0) ---
# The issuer must include https:// and the trailing slash.
# The audience must exactly match the Auth0 API identifier.
# In production these are overridden by environment variables in the systemd unit.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-fgdtxscrn2rgu4z0.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://enterprise-risk-api

# --- Server ---
server.port=8080
# Listen only on loopback: from the internet the API is reachable ONLY through Apache.
server.address=127.0.0.1
# Honour X-Forwarded-* headers set by the Apache reverse proxy.
server.forward-headers-strategy=framework

# --- CORS: exact origins only, no wildcards (comma separated) ---
app.cors.allowed-origins=http://localhost:5173,https://YOUR-SUBDOMAIN.duckdns.org

# --- Actuator: health only, without details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
